<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M Scouting | Download</title>
<link rel="icon" href="m_scouting_m_logo.png">
<style>
:root{color-scheme:dark;--red:#e21d38;--bright:#ff334f;--green:#19c784;--ink:#f3eaee;--mute:#cdbec5}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;color:var(--ink);background:#080609}
body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;
  padding:clamp(120px,36vh,400px) 16px 28px;overflow-x:hidden}
.still{position:fixed;inset:0;z-index:-3;background:#080609 url(m_scouting_eyes_still.jpg) 50% 25%/cover no-repeat}
.bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%;z-index:-2;background:transparent}
.shade{position:fixed;inset:0;z-index:-1;background:rgba(0,0,0,.22);pointer-events:none}
@media (max-aspect-ratio:1/1){
  .still{background-size:100% auto;background-position:top center}
  .bg{inset:0 auto auto 0;height:auto;aspect-ratio:1672/940;object-fit:contain}
  body{padding-top:calc(100vw * .5622 + 14px)}
}
main{position:relative;width:min(440px,100%);padding:26px 28px 24px;border:1px solid rgba(255,70,90,.55);border-radius:18px;
  background:rgba(12,6,10,.86);box-shadow:0 0 35px rgba(207,0,35,.22);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
.head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.head img{height:34px;width:auto}
.head span{font-size:21px;font-weight:700;letter-spacing:3px;color:#fff}
h1{font-size:22px;margin:10px 0 6px;font-weight:700}
.sub{margin:0 0 18px;font-size:14px;line-height:1.6;color:var(--mute)}
ol{margin:0 0 20px;padding-left:20px;font-size:13px;line-height:1.8;color:#e7dce1}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border:1px solid #ff4b62;border-radius:10px;padding:14px 18px;
  background:linear-gradient(120deg,#a90025,#ed183c);color:#fff;font-weight:700;font-size:15px;letter-spacing:1px;
  box-shadow:0 5px 22px #a9002538;transition:filter .2s,transform .2s}
a.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn.off{background:#3d1820;border-color:#5c2630;color:#9d8a90;box-shadow:none;cursor:not-allowed}
.note{margin:12px 0 0;font-size:12px;line-height:1.55;color:var(--mute);text-align:center}
.note.warn{color:#ff8796}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
  .bg{display:none}
}
</style>
</head>
<body>
<video id="bg" class="bg" onerror="this.style.display='none'" autoplay muted loop playsinline preload="auto" poster="m_scouting_eyes_still.jpg" aria-hidden="true">
  <source src="m_scouting_eyes_animation.mp4" type="video/mp4">
</video>
<div class="still" aria-hidden="true"></div>
<div class="shade" aria-hidden="true"></div>

<main>
  <div class="head"><img src="m_scouting_m_logo.png" alt=""><span>SCOUTING</span></div>
  <h1>Download M Scouting</h1>
  <p class="sub">Get the M Scouting desktop software and start your trial.</p>
  <ol>
    <li>Download and run the installer.</li>
    <li>Open M Scouting and create your account.</li>
    <li>Confirm your email from the message we send you.</li>
  </ol>
  <a id="download" class="btn off" href="#" aria-disabled="true">INSTALLER COMING SOON</a>
  <p id="note" class="note">The download link has not been added yet.</p>
</main>

<script>
/* ===========================================================================
   >>> PASTE YOUR REAL INSTALLER LINK BETWEEN THE QUOTES BELOW <<<
   Example of the shape (this is NOT a real link):  https://example.com/your-installer.exe
   Leave it empty ("") until the installer is ready. The button stays switched
   off, so nobody is ever sent to a made-up address.
=========================================================================== */
const INSTALLER_URL = "";

(function () {
  const btn = document.getElementById('download'), note = document.getElementById('note');
  let ok = false;
  try {
    const u = new URL(INSTALLER_URL);                 // throws if empty or not a proper address
    ok = u.protocol === 'https:' && !/\s/.test(INSTALLER_URL);
  } catch (e) { ok = false; }
  if (ok) {
    btn.href = INSTALLER_URL;
    btn.rel = 'noopener noreferrer';
    btn.className = 'btn';
    btn.removeAttribute('aria-disabled');
    btn.textContent = 'DOWNLOAD M SCOUTING';
    note.textContent = 'Only download M Scouting from this page.';
  } else {
    btn.addEventListener('click', ev => ev.preventDefault());
    if (INSTALLER_URL) {                              // something was typed but it is not a safe https link
      note.textContent = 'The download link in this page is not a valid https address. Please fix it.';
      note.className = 'note warn';
    }
  }
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
    try { document.getElementById('bg').pause(); } catch (e) {}
  }
})();
</script>
</body>
</html>
