<style>
:root{--bg:#0b0506;--card:#150a0c;--line:#3a1216;--red:#d6202e;--red2:#ff4b57;--txt:#f3e9ea;--mut:#a99295;--ok:#3ecf7a}
*{box-sizing:border-box}html,body{margin:0;min-height:100vh;min-height:100dvh}
body{background:radial-gradient(900px 500px at 50% -10%,#3b0c12 0%,var(--bg) 60%) fixed;color:var(--txt);
font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 24px;
box-shadow:0 20px 60px rgba(214,32,46,.12);text-align:center}
.brand{letter-spacing:.35em;font-size:13px;color:var(--red2);font-weight:700;margin-bottom:18px}
.icon{width:64px;height:64px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:30px;border:2px solid var(--red)}
.icon.ok{border-color:var(--ok);color:var(--ok)}.icon.bad{border-color:var(--red2);color:var(--red2)}
h1{font-size:22px;margin:0 0 10px}p{color:var(--mut);line-height:1.55;margin:0 0 14px;font-size:15px}
label{display:block;text-align:left;font-size:13px;color:var(--mut);margin:14px 0 6px}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#0e0608;color:var(--txt);font-size:16px}
input:focus{outline:2px solid var(--red);border-color:var(--red)}
button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:var(--red);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
button:hover{background:var(--red2)}button:disabled{opacity:.5;cursor:default}
.rules{font-size:12px;color:var(--mut);text-align:left;margin-top:8px}.msg{margin-top:14px;font-size:14px;min-height:20px}
.msg.err{color:var(--red2)}small{display:block;margin-top:20px;color:#6d5a5c;font-size:12px}
.hide{display:none}.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--red2);border-radius:50%;margin:6px auto 14px;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
